<!DOCTYPE html>
<html>
<head>
    <title>For My Forever Love ❤️</title>

    <style>
        body {
            margin: 0;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            color: white;
            overflow: hidden;
        }

        h1 {
            margin-top: 80px;
            font-size: 50px;
        }

        #typing {
            font-size: 22px;
            margin-top: 20px;
            min-height: 40px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background-color: white;
            color: #ff4e7a;
            cursor: pointer;
            margin: 15px;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        #message {
            display: none;
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .heart {
            position: fixed;
            top: -10px;
            font-size: 24px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <h1>Hey My Love ❤️</h1>

    <p id="typing"></p>

    <button onclick="startSurprise()">Click For Surprise 💌</button>

    <div id="proposal" style="display:none;">
        <h2>Will you be mine forever? 💍</h2>
        <button onclick="yes()">Yes ❤️</button>
        <button onmouseover="moveButton(this)">No 😜</button>
    </div>

    <div id="message">
        You are my happiness, my peace, and my forever person ❤️✨
    </div>

    <!-- Add your romantic mp3 file in same folder -->
    <audio id="bgMusic" src="music.mp3"></audio>

<script>

    // Typing Effect
    let text = "You are the best thing that ever happened to me ❤️";
    let i = 0;

    function typeEffect() {
        if (i < text.length) {
            document.getElementById("typing").innerHTML += text.charAt(i);
            i++;
            setTimeout(typeEffect, 80);
        }
    }

    window.onload = typeEffect;

    // Start Surprise
    function startSurprise() {
        document.getElementById("bgMusic").play();
        document.getElementById("proposal").style.display = "block";
        createHearts();
    }

    // Yes Button
    function yes() {
        document.getElementById("message").style.display = "block";
        createHearts();
    }

    // Moving No Button
    function moveButton(button) {
        button.style.position = "absolute";
        button.style.left = Math.random() * 80 + "vw";
        button.style.top = Math.random() * 80 + "vh";
    }

    // Falling Hearts
    function createHearts() {
        for (let i = 0; i < 30; i++) {
            let heart = document.createElement("div");
            heart.innerHTML = "❤️";
            heart.className = "heart";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
    }

</script>

</body>
</html>
