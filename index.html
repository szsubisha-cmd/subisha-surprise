<!DOCTYPE html>
<html>
<head>
    <title>For My Love </title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            color: white;
            padding-top: 100px;
        }
        h1 {
            font-size: 50px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background-color: white;
            color: #ff4e7a;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Hey My Love </h1>
    <p>You are the best thing that ever happened to me.</p>
    <button onclick="showMessage()">Click Me 💌</button>

    <script>
        function showMessage() {
            alert("Will you be my forever Valentine? ");
        }
    </script>
</body>
</html>
